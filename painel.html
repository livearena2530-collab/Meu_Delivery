<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - JoyFoods Delivery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 40px 20px; }
        .admin-box { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #ea1d2c; margin-bottom: 25px; font-weight: 800; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #333; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; font-family: inherit; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { border-color: #ea1d2c; outline: none; }
        .btn-submit { background: #ea1d2c; color: #fff; border: none; padding: 15px; width: 100%; font-size: 1rem; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #ff7b85; cursor: not-allowed; }
        .msg { display: none; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: center; font-weight: 600; font-size: 0.9rem; }
        .msg.success { display: block; background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg.error { display: block; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .helper-text { font-size: 0.75rem; color: #777; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>Cadastrar Produto</h2>
    
    <form id="form-produto">
        <div class="form-group">
            <label>Categoria</label>
            <select id="categoria" required>
                <option value="Lanches">Lanches</option>
                <option value="Pizzas">Pizzas</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Sobremesas">Sobremesas</option>
            </select>
        </div>

        <div class="form-group">
            <label>Nome do Produto</label>
            <input type="text" id="nome" placeholder="Ex: Heineken 330ml" required>
        </div>

        <div class="form-group">
            <label>Descrição</label>
            <textarea id="descricao" rows="3" placeholder="Ex: Cerveja long neck gelada" required></textarea>
        </div>

        <div class="form-group">
            <label>Preço (R$)</label>
            <input type="number" step="0.01" id="preco" placeholder="Ex: 8.50" required>
        </div>

        <div class="form-group">
            <label>Link da Imagem (URL)</label>
            <input type="url" id="imagem" placeholder="https://..." required>
            <span class="helper-text">Copie o link de uma imagem da internet (terminada em .jpg, .png).</span>
        </div>

        <div class="form-group">
            <label>Adicionais (Opcional)</label>
            <input type="text" id="adicionais" placeholder="Ex: Gelo:2.00; Limão:1.50">
            <span class="helper-text">Formato: Nome:Preco; Nome2:Preco2. Separe com ponto e vírgula (;).</span>
        </div>

        <button type="submit" class="btn-submit" id="btn-submit">Salvar na Planilha</button>
        
        <div id="mensagem" class="msg"></div>
    </form>
</div>

<script>
    // SEU LINK OFICIAL AQUI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQjSrJA8FnIpxfrSfw_cPjpeTLvPfhrUotlJUaU6EylD8TJNsQ5LPTVHIRHL9PK-rXIw/exec';

    document.getElementById('form-produto').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btn-submit');
        const msgDiv = document.getElementById('mensagem');
        
        // Bloqueia o botão e mostra carregamento
        btn.disabled = true;
        btn.innerText = "Salvando produto, aguarde...";
        msgDiv.className = 'msg';

        const produto = {
            id: 'PROD-' + Date.now(),
            categoria: document.getElementById('categoria').value,
            nome: document.getElementById('nome').value,
            descricao: document.getElementById('descricao').value,
            preco: document.getElementById('preco').value,
            imagem: document.getElementById('imagem').value,
            adicionais: document.getElementById('adicionais').value || ""
        };

        try {
            // O segredo para não dar erro de CORS: enviar como text/plain
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(produto)
            });

            const result = await response.json();

            if (result.status === 'success') {
                msgDiv.innerText = "✅ Produto salvo com sucesso na planilha!";
                msgDiv.className = 'msg success';
                document.getElementById('form-produto').reset(); // Limpa o formulário
            } else {
                throw new Error("Erro do lado do servidor: " + (result.message || "Desconhecido"));
            }
        } catch (error) {
            msgDiv.innerHTML = "❌ <b>Erro ao salvar.</b><br>Verifique se você publicou como 'Nova Versão' no Google Apps Script.";
            msgDiv.className = 'msg error';
            console.error(error);
        } finally {
            // Libera o botão novamente
            btn.disabled = false;
            btn.innerText = "Salvar na Planilha";
        }
    });
</script>

</body>
</html>
